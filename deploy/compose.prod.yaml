# SplitSync on the portfolio-apps host (deploy/deploy.sh drives it).
#   SPLITSYNC_IMAGE=splitsync:<sha> docker compose -p splitsync -f deploy/compose.prod.yaml --env-file /opt/splitsync/.env up -d
# Joins the shared "portfolio" network (deploy/portfolio/compose.yaml) to reach its Postgres
# (database "splitsync", own role) and Redis. Nothing is published: Caddy routes /splitsync/ here.
name: splitsync

x-app: &app
  image: ${SPLITSYNC_IMAGE:?set SPLITSYNC_IMAGE to the release image}
  env_file: ${SPLITSYNC_ROOT:-/opt/splitsync}/.env
  init: true
  networks: [portfolio]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  splitsync-migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  splitsync-app:
    <<: *app
    restart: unless-stopped
    mem_limit: 400m   # two Uvicorn workers, ~160 MB measured; the host has 2 GB plus 2 GB swap
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  portfolio:
    name: portfolio
    external: true
