name: deploy

# Deploys main to the EC2 host once CI has passed, and on demand (Actions > deploy > Run workflow)
# any commit sha from main, or --rollback. deploy/deploy.sh on the host does the work: it builds
# splitsync:<sha> from its clone, migrates, replaces the app, runs the smoke test and rolls back
# on its own if anything fails. This job only asks it to, over SSH with a key whose forced command
# can do nothing else (docs/deploy.md). Same shape as Sift's and Hopper's deploy.yml.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit sha from main to deploy, or --rollback"
        required: true

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.EC2_HOST != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    timeout-minutes: 20
    env:
      SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: SSH key, the server's host key, and the host as "splitsync"
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host splitsync
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF

      # The sha travels as data (SSH_ORIGINAL_COMMAND on the host, where deploy.sh accepts one
      # word), never as part of a shell command. "--" stops ssh reading --rollback as an option.
      - name: Deploy ${{ env.SHA }}
        run: ssh -- splitsync "$SHA"

      - name: Public URL answers
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: curl -fsS --retry 3 --retry-delay 2 "${PUBLIC_URL%/}/readyz"
